<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нотатки — UDC WS8</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Нотатки</h1>
      <label for="user">
        Я увійшов як
        <select id="user">
          <option value="1">Оля</option>
          <option value="2">Тарас</option>
        </select>
      </label>
    </header>

    <nav class="tabs" aria-label="Фільтр нотаток">
      <button type="button" id="tab-active" class="tab-btn active" aria-current="page">Активні</button>
      <button type="button" id="tab-archived" class="tab-btn">Архів</button>
    </nav>

    <form id="new-note" aria-label="Створити нотатку">
      <label for="title" class="sr-only">Заголовок</label>
      <input id="title" placeholder="Заголовок" required />
      <label for="body" class="sr-only">Текст</label>
      <input id="body" placeholder="Текст" />
      <button type="submit">Додати</button>
    </form>

    <ul id="notes" aria-label="Список нотаток"></ul>
    <p id="empty" class="empty-state" hidden>Нотаток поки немає.</p>
    <p id="empty-archived" class="empty-state" hidden>Архівованих нотаток немає.</p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
